<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario Online - Suscripción</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header>
        <h1>EL DIARIO ONLINE</h1>
        <p>Noticias frescas, todos los días</p>
    </header>

    
    <main>
        <div class="container">

            <div class="form-header">
                <h2 id="dynamicTitle">HOLA</h2>
            </div>

            <div class="form-body">
                <form id="mainForm">
                    <div class="form-grid">

                        <div class="field-group">
                            <label for="nombreCompleto">Nombre Completo</label>
                            <input type="text" id="nombreCompleto" name="nombreCompleto"
                                   placeholder="Ingresa tu nombre completo">
                            <div class="error-message" id="error-nombreCompleto"></div>
                        </div>

                        <div class="field-group">
                            <label for="email">Email</label>
                            <input type="text" id="email" name="email"
                                   placeholder="ejemplo@correo.com">
                            <div class="error-message" id="error-email"></div>
                        </div>

                        <div class="field-group">
                            <label for="contrasena">Contraseña</label>
                            <input type="password" id="contrasena" name="contrasena"
                                   placeholder="Mínimo 8 caracteres">
                            <div class="error-message" id="error-contrasena"></div>
                        </div>

                        <div class="field-group">
                            <label for="repetirContrasena">Repetir Contraseña</label>
                            <input type="password" id="repetirContrasena" name="repetirContrasena"
                                   placeholder="Repetí tu contraseña">
                            <div class="error-message" id="error-repetirContrasena"></div>
                        </div>

                        <div class="field-group">
                            <label for="edad">Edad</label>
                            <input type="number" id="edad" name="edad"
                                   placeholder="Ej: 25">
                            <div class="error-message" id="error-edad"></div>
                        </div>

                        <div class="field-group">
                            <label for="telefono">Teléfono</label>
                            <input type="text" id="telefono" name="telefono"
                                   placeholder="Ej: 1145678901">
                            <div class="error-message" id="error-telefono"></div>
                        </div>

                        <div class="field-group">
                            <label for="direccion">Dirección</label>
                            <input type="text" id="direccion" name="direccion"
                                   placeholder="Ej: Corrientes 1234">
                            <div class="error-message" id="error-direccion"></div>
                        </div>

                        <div class="field-group">
                            <label for="ciudad">Ciudad</label>
                            <input type="text" id="ciudad" name="ciudad"
                                   placeholder="Ej: Buenos Aires">
                            <div class="error-message" id="error-ciudad"></div>
                        </div>

                        <div class="field-group">
                            <label for="codigoPostal">Código Postal</label>
                            <input type="text" id="codigoPostal" name="codigoPostal"
                                   placeholder="Ej: 1043">
                            <div class="error-message" id="error-codigoPostal"></div>
                        </div>

                        <div class="field-group">
                            <label for="dni">DNI</label>
                            <input type="text" id="dni" name="dni"
                                   placeholder="Ej: 35123456">
                            <div class="error-message" id="error-dni"></div>
                        </div>

                        <div class="submit-container">
                            <button type="submit" class="submit-btn">Enviar</button>
                        </div>

                    </div>
                </form>
            </div>

        </div>
    </main>


    <footer>
        <p>&copy; 2026 El Diario Online &mdash; Todos los derechos reservados</p>
    </footer>


    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Información del Formulario</h2>
                <span class="close">&times;</span>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
